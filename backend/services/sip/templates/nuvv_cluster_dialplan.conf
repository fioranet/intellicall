; ============================================================================
; Nuvv Telco - Dialplan de Integração ao Cluster Privado
; ============================================================================

[nuvv-cluster-outbound]
; 1. Transbordo Humano Direto para Atendentes no FreeSWITCH FSPBX (Ramais 1000 a 8999)
exten => _1XXX,1,NoOp(Transbordo Humano Nuvv Flow -> FSPBX Ramal: ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@fspbx-transfer,60)
 same => n,Hangup()

exten => _[2-8]XXX,1,NoOp(Transbordo Humano Nuvv Flow -> FSPBX Ramal: ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@fspbx-transfer,60)
 same => n,Hangup()

; 2. Transbordo com Prefixo 8 (ex: 81001 disca para 1001 no FSPBX)
exten => _8XXXX,1,NoOp(Transbordo Humano Nuvv Flow (Prefixo 8) -> FSPBX Ramal: ${EXTEN:1})
 same => n,Dial(PJSIP/${EXTEN:1}@fspbx-transfer,60)
 same => n,Hangup()

; 3. Discagem Externa Tarifada via MagnusBilling Core
exten => _X.,1,NoOp(Discagem Externa Ativa Nuvv Flow via MagnusBilling: ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@magnus-billing,60)
 same => n,Hangup()

exten => _+X.,1,NoOp(Discagem Externa E.164 Nuvv Flow via MagnusBilling: ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@magnus-billing,60)
 same => n,Hangup()
