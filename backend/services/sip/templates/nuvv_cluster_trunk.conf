; ============================================================================
; Nuvv Telco - Cluster Privado L2 Trunk Configuration
; ============================================================================

; --- Tronco 1: MagnusBilling Core (Tarifação e Saída Externa) ---
[magnus-billing]
type = endpoint
transport = intellicall-transport-udp
context = intellicall-inbound
disallow = all
allow = ulaw,alaw,opus,g722
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
media_address = 10.20.30.6
aors = magnus-billing-aor

[magnus-billing-aor]
type = aor
contact = sip:10.20.30.3:5060
qualify_frequency = 30

[magnus-billing-identify]
type = identify
endpoint = magnus-billing
match = 10.20.30.3/32


